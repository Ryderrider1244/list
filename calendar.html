
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List｜日曆</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="site-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="site-title">List</h1>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link">
                    <span>⌂</span>
                    首頁
                </a>

                <a href="calendar.html" class="nav-link active">
                    <span>▦</span>
                    行事曆
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <section class="calendar-section">

                <!-- Calendar Header -->
                <div class="calendar-header">
                    <h2>2026年10月</h2>

                    <div class="calendar-view">
                        <button type="button">日</button>
                        <button type="button">週</button>
                        <button type="button">月</button>
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="calendar-grid">

                    <!-- Weekday Labels -->
                    <div class="weekday">日</div>
                    <div class="weekday">一</div>
                    <div class="weekday">二</div>
                    <div class="weekday">三</div>
                    <div class="weekday">四</div>
                    <div class="weekday">五</div>
                    <div class="weekday">六</div>

                    <!-- September 27–30 -->
                    <div class="day muted">27</div>
                    <div class="day muted">28</div>
                    <div class="day muted">29</div>
                    <div class="day muted">30</div>

                    <!-- October 1–3 -->
                    <div class="day">1</div>
                    <div class="day">2</div>
                    <div class="day">3</div>

                    <!-- October 4–10 -->
                    <div class="day">4</div>
                    <div class="day">5</div>
                    <div class="day">6</div>
                    <div class="day">7</div>
                    <div class="day">8</div>
                    <div class="day">9</div>
                    <div class="day">10</div>

                    <!-- October 11–17 -->
                    <div class="day">11</div>
                    <div class="day">12</div>
                    <div class="day">13</div>
                    <div class="day">14</div>
                    <div class="day">15</div>
                    <div class="day">16</div>
                    <div class="day">17</div>

                    <!-- October 18–24 -->
                    <div class="day">18</div>
                    <div class="day">19</div>
                    <div class="day">20</div>
                    <div class="day">21</div>
                    <div class="day">22</div>
                    <div class="day today">23</div>
                    <div class="day">24</div>

                    <!-- October 25–31 -->
                    <div class="day">25</div>
                    <div class="day">26</div>
                    <div class="day">27</div>
                    <div class="day">28</div>
                    <div class="day">29</div>
                    <div class="day">30</div>
                    <div class="day">31</div>

                </div>
            </section>

        </main>
    </div>
</body>
</html>


<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List｜首頁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-layout">

        <aside class="sidebar">
            <h1 class="site-title">List</h1>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link active">
                    <span>⌂</span> 首頁
                </a>
                <a href="calendar.html" class="nav-link">
                    <span>▦</span> 行事曆
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <button id="open-form"><span class="button-icon">+</span>新增</button>

                <div id="popup" class="popup">
                    <form id="task-form" class="popup-content">
                        <button id="close-form" type="button" class="close-button">&times;</button>
                    
                        <label for="task-name"></label>
                        <input type="text" id="task-name" placeholder="提醒事項">

                        <label for="reminder-type">類型</label>
                        <select id="reminder-type">
                            <option value="daily">每日</option>
                            <option value="period">期間</option>
                        </select>

                        <div id="date-fields-period">
                            <label for="start-date">起始時間</label>
                            <label for="due-date">完結時間</label>
                            <input type="date" id="start-date">
                            <input type="date" id="due-date">
                        </div>

                        <div id="date-fields-daily">
                            <label for="daily-date">設定時間</label>
                            <input type="date" id="daily-date">
                        </div>

                        <button id="add-task" type="submit">Add task</button>
                    </form>
                </div>

            <div class="dashboard">

                <section class="daily-checklist">
                    <h2>每日清單</h2>
                    <p class="date">2026年10月23日</p>
                    <h3>To Do</h3>
                    <ul id="active-tasks">
                        <li class="task">
                            <input type="checkbox" id="task1">
                            <label for="task1">完成作業</label>
                        </li>
                        <li class="task">
                            <input type="checkbox" id="task2">
                            <label for="task2">複習筆記</label>
                        </li>
                        <li class="task">
                            <input type="checkbox" id="task3">
                            <label for="task3">整理書包</label>
                        </li>
                    </ul>

                    <h3>Completed</h3>
                    <ul id="completed-tasks"></ul>
                </section>

                <section class="task-section">
                    <ul id="task-list"></ul>
                    
                </section>
            </div>
        </main>

    </div>
    <script src="script.js"></script>
</body>
</html>

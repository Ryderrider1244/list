
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List｜首頁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-layout">

        <aside class="sidebar">
            <h1 class="site-title">List</h1>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link active">
                    <span>⌂</span> 首頁
                </a>
                <a href="calendar.html" class="nav-link">
                    <span>▦</span> 行事曆
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <button id="open-form"><span class="button-icon">+</span>新增</button>

                <div id="popup" class="popup">
                    <div class="popup-content">
                        <button id="close-form" class="close-button">&times;</button>

                        <h2>新增提醒</h2>

                        <label for="task-name">提醒事項</label>
                        <input type="text" id="task-name" placeholder="What do you need to do?">

                        <label for="reminder-type">類型</label>
                        <select id="reminder-type">
                            <option value="daily">直到完成</option>
                            <option value="period">時效性</option>
                        </select>

                        <div id="date-fields">
                            <label for="start-date">Start Date</label>
                            <label for="due-date">End Date</label>
                            <input type="date" id="start-date">
                            <input type="date" id="due-date">
                        </div>

                        <button id="add-task">Add task</button>
                    </div>
                </div>

            <div class="dashboard">

                <section class="daily-checklist">
                    <h2>每日清單</h2>
                    <p class="date">2026年10月23日</p>
                    <h3>To Do</h3>
                    <ul id="active-tasks">
                        <li class="task">
                            <input type="checkbox" id="task1">
                            <label for="task1">完成作業</label>
                        </li>
                        <li class="task">
                            <input type="checkbox" id="task2">
                            <label for="task2">複習筆記</label>
                        </li>
                        <li class="task">
                            <input type="checkbox" id="task3">
                            <label for="task3">整理書包</label>
                        </li>
                    </ul>

                    <h3>Completed</h3>
                    <ul id="completed-tasks"></ul>
                </section>

                <section class="upcoming-events">
                    <h2>近期活動</h2>
                    <article class="event">
                        <p class="event-date">10月25日</p>
                        <h3>數學作業截止</h3>
                        <p>完成數學習題</p>
                    </article>
                    <article class="event">
                        <p class="event-date">10月28日</p>
                        <h3>英文報告</h3>
                        <p>準備課堂報告</p>
                    </article>
                    <article class="event">
                        <p class="event-date">10月30日</p>
                        <h3>社團活動</h3>
                        <p>參加社團聚會</p>
                    </article>
                </section>
            </div>
        </main>

    </div>
    <script src="script.js"></script>
</body>
</html>

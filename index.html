
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List｜首頁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-layout">

        <aside class="sidebar">
            <h1 class="site-title">List</h1>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link active">
                    <span>⌂</span> 首頁
                </a>
                <a href="calendar.html" class="nav-link">
                    <span>▦</span> 行事曆
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <section class="welcome">
                <h2>今天要做什麼？</h2>
                <p>整理你的每日任務與近期活動。</p>
            </section>

            <div class="dashboard">
                <section class="daily-checklist">
                    <h2>每日清單</h2>
                    <p class="date">2026年10月23日</p>
                    <ul>
                        <li><input type="checkbox" id="task1">
                            <label for="task1">完成作業</label></li>
                        <li><input type="checkbox" id="task2">
                            <label for="task2">複習筆記</label></li>
                        <li><input type="checkbox" id="task3">
                            <label for="task3">整理書包</label></li>
                    </ul>
                </section>

                <section class="upcoming-events">
                    <h2>近期活動</h2>
                    <article class="event">
                        <p class="event-date">10月25日</p>
                        <h3>數學作業截止</h3>
                        <p>完成數學習題</p>
                    </article>
                    <article class="event">
                        <p class="event-date">10月28日</p>
                        <h3>英文報告</h3>
                        <p>準備課堂報告</p>
                    </article>
                    <article class="event">
                        <p class="event-date">10月30日</p>
                        <h3>社團活動</h3>
                        <p>參加社團聚會</p>
                    </article>
                </section>
            </div>
        </main>

    </div>
</body>
</html>
